# =========================================================
# APPLICATION NAME
# =========================================================

spring.application.name=measurement


# =========================================================
# H2 DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

repository.type=database


# =========================================================
# JDBC CONNECTION POOL (HIKARI CP)
# =========================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.idle-timeout=30000

spring.datasource.hikari.connection-timeout=20000

spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# CUSTOM CONNECTION POOL CONFIGURATION
# =========================================================

pool.initialSize=5

pool.maxSize=10

pool.timeout=5000


# =========================================================
# H2 CONSOLE
# =========================================================

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console


# =========================================================
# SQL INITIALIZATION
# =========================================================

spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:db/schema.sql


# =========================================================
# LOGGING CONFIGURATION
# =========================================================

logging.level.root=INFO

logging.level.com.quantity.measurement=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# =========================================================
# JPA LOGGING (OPTIONAL)
# =========================================================

spring.jpa.show-sql=true